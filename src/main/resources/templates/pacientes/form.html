<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Paciente | Sistema Hospitalario</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Recepción</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/citas/nueva}">Registrar nueva cita</a>
                <a class="nav-link" th:href="@{/citas}">Consultar citas</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Registrar Paciente</h1>
                    <p class="text-muted">
                        Registro auxiliar del paciente cuando no existe durante el proceso de cita médica.
                    </p>
                </div>

                <a th:href="@{/citas/nueva}" class="btn btn-outline-secondary">
                    Volver a registrar cita
                </a>
            </div>

            <form action="#" method="post">

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Datos personales</h5>

                        <div class="row g-3">

                            <div class="col-md-3">
                                <label class="form-label">DNI</label>
                                <input type="text" class="form-control" maxlength="8" placeholder="Ingrese DNI">
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Nombres</label>
                                <input type="text" class="form-control" placeholder="Ingrese nombres">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control" placeholder="Ingrese apellidos">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Sexo</label>
                                <select class="form-select">
                                    <option selected>Seleccione</option>
                                    <option>Masculino</option>
                                    <option>Femenino</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control" placeholder="Ingrese teléfono">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Correo</label>
                                <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                            </div>

                        </div>
                    </div>
                </div>

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Dirección y contacto</h5>

                        <div class="row g-3">

                            <div class="col-md-8">
                                <label class="form-label">Dirección</label>
                                <input type="text" class="form-control" placeholder="Ingrese dirección">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Distrito</label>
                                <input type="text" class="form-control" placeholder="Ingrese distrito">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Contacto de emergencia</label>
                                <input type="text" class="form-control" placeholder="Nombre del contacto">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Parentesco</label>
                                <input type="text" class="form-control" placeholder="Ej. Madre, padre, hermano">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Teléfono de emergencia</label>
                                <input type="text" class="form-control" placeholder="Teléfono">
                            </div>

                        </div>
                    </div>
                </div>

                <div class="card card-stat">
                    <div class="card-body d-flex justify-content-end gap-2">
                        <a th:href="@{/citas/nueva}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Guardar paciente
                        </button>
                    </div>
                </div>

            </form>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
