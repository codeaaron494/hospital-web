<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Paciente - Recepción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-hospital"></i> Sistema Hospitalario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/citas"><i class="bi bi-calendar-check"></i> Directorio de Citas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/pacientes/nuevo"><i class="bi bi-person-plus"></i> Apertura de Paciente</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3" th:text="${#authentication.name}"><i class="bi bi-person-badge"></i> Usuario</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h3 class="h5 text-dark fw-bold mb-0"><i class="bi bi-person-vcard text-primary me-2"></i> Registro de Nuevo Paciente</h3>
                    <p class="text-muted small mt-1">Complete los datos para generar la historia clínica. Todos los campos marcados con (*) son obligatorios.</p>
                </div>
                <div class="card-body p-4">
                    
                    <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="dniPaciente" class="form-label fw-medium text-dark small">DNI / Documento (*)</label>
                                <input type="text" class="form-control bg-light" id="dniPaciente" th:field="*{dniPaciente}" required maxlength="8" placeholder="Ingrese 8 dígitos">
                            </div>
                            <div class="col-md-6">
                                <label for="telefonoPaciente" class="form-label fw-medium text-dark small">Teléfono de Contacto</label>
                                <input type="text" class="form-control bg-light" id="telefonoPaciente" th:field="*{telefonoPaciente}" maxlength="15" placeholder="Ej. 987654321">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="nombresPaciente" class="form-label fw-medium text-dark small">Nombres (*)</label>
                                <input type="text" class="form-control bg-light" id="nombresPaciente" th:field="*{nombresPaciente}" required placeholder="Nombres del paciente">
                            </div>
                            <div class="col-md-6">
                                <label for="apellidosPaciente" class="form-label fw-medium text-dark small">Apellidos (*)</label>
                                <input type="text" class="form-control bg-light" id="apellidosPaciente" th:field="*{apellidosPaciente}" required placeholder="Apellidos del paciente">
                            </div>
                        </div>

                        <input type="hidden" th:field="*{estadoPaciente}">

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="/dashboard" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm"><i class="bi bi-save me-1"></i> Registrar Paciente</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
