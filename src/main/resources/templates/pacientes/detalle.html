<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Paciente | Sistema Hospitalario</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Recepción</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/citas/nueva}">Registrar nueva cita</a>
                <a class="nav-link" th:href="@{/citas}">Consultar citas</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Detalle de Paciente</h1>
                    <p class="text-muted">
                        Información básica del paciente registrado.
                    </p>
                </div>

                <a th:href="@{/citas/nueva}" class="btn btn-outline-secondary">
                    Volver a registrar cita
                </a>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos del paciente</h5>

                    <div class="row g-3">

                        <div class="col-md-3">
                            <label class="form-label">DNI</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${paciente.dniPaciente}"
                                   readonly>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label">Paciente</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${paciente.nombreCompleto}"
                                   readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Teléfono</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${paciente.telefonoPaciente}"
                                   readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Estado</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${paciente.estadoPaciente}"
                                   readonly>
                        </div>

                    </div>
                </div>
            </div>

            <div class="card card-stat">
                <div class="card-body d-flex justify-content-end gap-2">
                    <a th:href="@{/citas/nueva}" class="btn btn-primary">
                        Registrar cita para este paciente
                    </a>

                    <a th:href="@{/citas}" class="btn btn-outline-secondary">
                        Consultar citas
                    </a>
                </div>
            </div>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
