<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Enfermería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/enfermeria/dashboard">
            <i class="bi bi-hospital"></i>
            Sistema Hospitalario
        </a>

        <!-- Botón responsive -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Contenido -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Menú -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="/enfermeria/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Panel
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/enfermeria/fichas">
                        <i class="bi bi-file-medical"></i>
                        Fichas de Triaje
                    </a>
                </li>

            </ul>

            <!-- Usuario -->
            <div class="d-flex align-items-center">

                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-badge"></i>

                    <span th:text="${#authentication.name}">
                        Usuario
                    </span>
                </span>

                <form th:action="@{/logout}" method="post" class="m-0">

                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Cerrar Sesión
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- CONTENIDO -->
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm rounded-4 text-center p-4">

                <i class="bi bi-clipboard-pulse text-info fs-1 mb-3"></i>

                <h4 class="fw-bold">
                    Gestión de Triaje
                </h4>

                <p class="text-muted">
                    Consulte las fichas de admisión pendientes para realizar el registro de signos vitales.
                </p>

                <a href="/enfermeria/fichas"
                   class="btn btn-info text-white fw-bold mt-2">

                    Consultar Fichas de Admisión

                </a>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
