<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Administrador | Sistema Hospitalario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Administrador</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/dashboard}">Recepción</a>
                <a class="nav-link" th:href="@{/enfermeria/dashboard}">Enfermería</a>
                <a class="nav-link" th:href="@{/medico/dashboard}">Médico</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">
            <h1 class="page-title">Dashboard Administrador</h1>
            <p class="text-muted">
                Acceso general a los módulos del sistema hospitalario.
            </p>

            <div class="card card-stat mt-4">
                <div class="card-body">
                    <h5>Módulos disponibles</h5>
                    <p class="text-muted mb-0">
                        Recepción, Enfermería, Médico, Historia Clínica y Farmacia.
                    </p>
                </div>
            </div>
        </main>

    </div>
</div>

</body>
</html>
