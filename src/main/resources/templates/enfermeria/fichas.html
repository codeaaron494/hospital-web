<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Triaje - Enfermería</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/enfermeria/dashboard">
            <i class="bi bi-hospital"></i>
            Sistema Hospitalario
        </a>

        <!-- Botón responsive -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Contenido -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Menú -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/enfermeria/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Panel
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/enfermeria/fichas">
                        <i class="bi bi-file-medical"></i>
                        Fichas de Triaje
                    </a>
                </li>

            </ul>

            <!-- Usuario -->
            <div class="d-flex align-items-center">

                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-badge"></i>

                    <span th:text="${#authentication.name != null ? #authentication.name : 'Usuario'}">
                        Usuario
                    </span>
                </span>

                <form th:action="@{/logout}" method="post" class="m-0">

                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Cerrar Sesión
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- CONTENIDO -->
<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">

        <h3 class="fw-bold text-dark">
            <i class="bi bi-file-medical text-primary me-2"></i>
            Fichas de Admisión Pendientes
        </h3>

        <a href="/enfermeria/dashboard"
           class="btn btn-outline-secondary shadow-sm">

            Volver al Panel

        </a>

    </div>

    <!-- Buscador -->
    <form th:action="@{/enfermeria/fichas}" method="get" class="mb-4">

        <div class="input-group shadow-sm">

            <input type="text"
                   name="dni"
                   class="form-control"
                   placeholder="Buscar por DNI del paciente..."
                   th:value="${dniBuscado}">

            <button class="btn btn-primary text-white px-4" type="submit">

                Buscar

            </button>

        </div>

    </form>

    <!-- Tabla -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>
                        <th class="px-4">Ficha N°</th>
                        <th>Paciente</th>
                        <th>Prioridad</th>
                        <th>Fecha Admisión</th>
                        <th class="text-end px-4">Acción</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="ficha : ${fichas}">

                        <!-- ID -->
                        <td class="px-4 fw-bold"
                            th:text="${'FA-' + ficha.idFichaAdmision}">
                            FA-001
                        </td>

                        <!-- Paciente -->
                        <td th:text="${ficha.paciente != null ? ficha.paciente.nombreCompleto : 'N/A'}">
                            Nombre
                        </td>

                        <!-- Prioridad -->
                        <td>

                            <span class="badge rounded-pill"
                                  th:classappend="${ficha.prioridad == 'Alta' ? 'bg-danger' : (ficha.prioridad == 'Media' ? 'bg-warning text-dark' : 'bg-success')}">

                                [[${ficha.prioridad}]]

                            </span>

                        </td>

                        <!-- Fecha -->
                        <td th:text="${#temporals.format(ficha.fechaAdmision, 'dd/MM/yyyy HH:mm')}">
                            Fecha
                        </td>

                        <!-- Acción -->
                        <td class="text-end px-4">

                            <a th:href="@{/enfermeria/triaje/{idFicha}(idFicha=${ficha.idFichaAdmision})}"
                               class="btn btn-sm shadow-sm"
                               th:classappend="${ficha.estadoFicha == 'Triaje' ? 'btn-outline-primary' : 'btn-primary text-white'}">

                                <i class="bi bi-clipboard-pulse me-1"></i>

                                [[${ficha.estadoFicha == 'Triaje' ? 'Ver Triaje' : 'Realizar Triaje'}]]

                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
