<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Triaje</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        body{
            background-color: #f4f6f9;
        }

        .triaje-card{
            border: none;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .triaje-header{
            background: linear-gradient(135deg, #0d6efd, #20c997);
            padding: 1.7rem 2rem;
        }

        .triaje-header h4{
            font-size: 1.7rem;
            font-weight: 700;
        }

        .form-label{
            color: #344054;
            font-size: .95rem;
            margin-bottom: .45rem;
        }

        .form-control{
            border-radius: 12px;
            padding: .8rem 1rem;
            border: 1px solid #d0d5dd;
            background-color: #fff;
            transition: .2s ease;
        }

        .form-control:focus{
            border-color: #0d6efd;
            box-shadow: 0 0 0 .15rem rgba(13,110,253,.15);
        }

        .form-control:disabled{
            background-color: #eef2f6;
            color: #344054;
            opacity: 1;
        }

        .alert-triaje{
            background-color: #e7f5ff;
            border: 1px solid #b6e0fe;
            border-radius: 14px;
            color: #0c5460;
            padding: 1rem 1.2rem;
        }

        .btn-guardar{
            border-radius: 12px;
            padding: .7rem 1.6rem;
            font-weight: 600;
        }

        .btn-cancelar{
            border-radius: 12px;
            padding: .7rem 1.4rem;
        }

        .card-body{
            background-color: #ffffff;
        }

        .section-title{
            font-size: 1rem;
            color: #667085;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/enfermeria/dashboard">
            <i class="bi bi-hospital"></i>
            Sistema Hospitalario
        </a>

        <!-- Responsive -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Contenido -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Menú -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/enfermeria/dashboard">
                        <i class="bi bi-speedometer2"></i>
                        Panel
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/enfermeria/fichas">
                        <i class="bi bi-file-medical"></i>
                        Fichas de Triaje
                    </a>
                </li>

            </ul>

            <!-- Usuario -->
            <div class="d-flex align-items-center">

                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-badge"></i>

                    <span th:text="${#authentication.name != null ? #authentication.name : 'Usuario'}">
                        Usuario
                    </span>
                </span>

                <form th:action="@{/logout}" method="post" class="m-0">

                    <button class="btn btn-outline-light btn-sm" type="submit">
                        Cerrar Sesión
                    </button>

                </form>

            </div>

        </div>

    </div>

</nav>

<!-- CONTENIDO -->
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9 col-xl-8">

            <div class="card triaje-card">

                <!-- HEADER -->
                <div class="triaje-header text-white">

                    <h4 class="mb-2">
                        <i class="bi bi-clipboard2-pulse me-2"></i>
                        Registro de Triaje
                    </h4>

                    <p class="mb-0 opacity-75 section-title text-white">
                        Paciente:
                        <strong>
                            [[${ficha.paciente.nombreCompleto}]]
                        </strong>
                    </p>

                </div>

                <!-- BODY -->
                <div class="card-body p-4 p-md-5">

                    <!-- ALERTA -->
                    <div th:if="${triajeExistente != null}"
                         class="alert-triaje mb-4">

                        <i class="bi bi-info-circle-fill me-2"></i>

                        Este paciente ya cuenta con signos vitales registrados para esta atención.

                    </div>

                    <!-- FORM -->
                    <form th:action="@{/enfermeria/triaje/{id}/guardar(id=${ficha.idFichaAdmision})}"
                          method="post">

                        <div class="row g-4">

                            <!-- Presión -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Presión Arterial (*)
                                </label>

                                <input type="text"
                                       name="presionArterial"
                                       class="form-control"
                                       placeholder="Ej: 120/80"
                                       th:value="${triajeExistente?.presionArterial}"
                                       required
                                       th:disabled="${triajeExistente != null}">

                            </div>

                            <!-- Frecuencia -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Frec. Cardíaca (BPM) (*)
                                </label>

                                <input type="number"
                                       name="frecuenciaCardiaca"
                                       class="form-control"
                                       placeholder="Ej: 75"
                                       th:value="${triajeExistente?.frecuenciaCardiaca}"
                                       required
                                       th:disabled="${triajeExistente != null}">

                            </div>

                            <!-- Peso -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Peso (kg) (*)
                                </label>

                                <input type="number"
                                       step="0.1"
                                       name="peso"
                                       class="form-control"
                                       placeholder="Ej: 70.5"
                                       th:value="${triajeExistente?.peso}"
                                       required
                                       th:disabled="${triajeExistente != null}">

                            </div>

                            <!-- Talla -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Talla (metros) (*)
                                </label>

                                <input type="number"
                                       step="0.01"
                                       name="talla"
                                       class="form-control"
                                       placeholder="Ej: 1.75"
                                       th:value="${triajeExistente?.talla}"
                                       required
                                       th:disabled="${triajeExistente != null}">

                                <div class="form-text mt-2">
                                    Ingrese en metros (ej. 1.75 para 175 cm).
                                </div>

                            </div>

                            <!-- Temperatura -->
                            <div class="col-md-12">

                                <label class="form-label fw-semibold">
                                    Temperatura (°C) (*)
                                </label>

                                <input type="number"
                                       step="0.1"
                                       name="temperatura"
                                       class="form-control"
                                       placeholder="Ej: 36.5"
                                       th:value="${triajeExistente?.temperatura}"
                                       required
                                       th:disabled="${triajeExistente != null}">

                            </div>

                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-end mt-5"
                             th:if="${triajeExistente == null}">

                            <a href="/enfermeria/fichas"
                               class="btn btn-light btn-cancelar me-2">

                                Cancelar

                            </a>

                            <button type="submit"
                                    class="btn btn-primary btn-guardar shadow-sm">

                                <i class="bi bi-check-circle me-1"></i>
                                Guardar Triaje

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
