<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Cita | Sistema Hospitalario</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Recepción</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/citas/nueva}">Registrar nueva cita</a>
                <a class="nav-link" th:href="@{/citas}">Consultar citas</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Detalle de Cita Médica</h1>
                    <p class="text-muted">
                        Información completa de la cita médica consultada.
                    </p>
                </div>

                <a th:href="@{/citas}" class="btn btn-outline-secondary">
                    Volver a consultar citas
                </a>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos generales de la cita</h5>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Código de cita</label>
                            <input type="text" class="form-control" value="CIT-0001" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Fecha</label>
                            <input type="text" class="form-control" value="20/05/2026" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Hora</label>
                            <input type="text" class="form-control" value="09:00" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" value="PROGRAMADA" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos del paciente</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Paciente</label>
                            <input type="text" class="form-control" value="Juan Pérez Ramos" readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control" value="76543210" readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Edad</label>
                            <input type="text" class="form-control" value="35" readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" value="987654321" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos médicos</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Especialidad</label>
                            <input type="text" class="form-control" value="Medicina General" readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Médico</label>
                            <input type="text" class="form-control" value="Dr. Carlos Mendoza" readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Consultorio</label>
                            <input type="text" class="form-control" value="Consultorio 201" readonly>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Motivo de consulta</label>
                            <textarea class="form-control" rows="3" readonly>Dolor de cabeza y malestar general.</textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat">
                <div class="card-body d-flex justify-content-end gap-2">
                    <a th:href="@{/citas}" class="btn btn-outline-secondary">
                        Volver
                    </a>

                    <a th:href="@{/citas/reprogramar}" class="btn btn-warning">
                        Reprogramar cita
                    </a>

                    <a th:href="@{/citas/anular}" class="btn btn-danger">
                        Anular cita
                    </a>
                </div>
            </div>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
