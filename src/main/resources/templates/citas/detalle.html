<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Cita | Sistema Hospitalario</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Recepción</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/citas/nueva}">Registrar nueva cita</a>
                <a class="nav-link" th:href="@{/citas}">Consultar citas</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Detalle de Cita Médica</h1>
                    <p class="text-muted">
                        Constancia de cita médica registrada en el sistema.
                    </p>
                </div>

                <a th:href="@{/citas}" class="btn btn-outline-secondary">
                    Volver a citas
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos de la cita</h5>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Código de cita</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${'CIT-' + cita.idCita}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Estado</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.estadoCita}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Fecha</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${#temporals.format(cita.fechaCita, 'dd/MM/yyyy')}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Hora</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${#temporals.format(cita.horaCita, 'HH:mm')}"
                                   readonly>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Motivo de consulta</label>
                            <textarea class="form-control"
                                      rows="3"
                                      readonly
                                      th:text="${cita.motivoConsulta}">
                            </textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos del paciente</h5>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">DNI</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.paciente.dniPaciente}"
                                   readonly>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label">Paciente</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.paciente.nombreCompleto}"
                                   readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Teléfono</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.paciente.telefonoPaciente}"
                                   readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Estado paciente</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.paciente.estadoPaciente}"
                                   readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos de atención programada</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Especialidad</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.especialidad.nombreEspecialidad}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Médico</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.medico.nombreCompleto}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">CMP</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.medico.cmpMedico}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Horario reservado</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${#temporals.format(cita.agenda.horaInicio, 'HH:mm') + ' - ' + #temporals.format(cita.agenda.horaFin, 'HH:mm')}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Estado horario</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.agenda.estadoHorario}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Registrado por</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${cita.usuario.username}"
                                   readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat">
                <div class="card-body d-flex justify-content-end gap-2">
                    <a th:href="@{/citas}" class="btn btn-outline-secondary">
                        Volver
                    </a>

                    <button type="button" class="btn btn-outline-primary" onclick="window.print()">
                        Imprimir constancia
                    </button>

                    <a th:if="${cita.estadoCita != 'ANULADA'}"
                       th:href="@{/citas/{id}/reprogramar(id=${cita.idCita})}"
                       class="btn btn-warning">
                        Reprogramar
                    </a>

                    <a th:if="${cita.estadoCita != 'ANULADA'}"
                       th:href="@{/citas/{id}/anular(id=${cita.idCita})}"
                       class="btn btn-danger">
                        Anular
                    </a>
                </div>
            </div>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
