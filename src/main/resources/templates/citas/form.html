<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Recepción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-hospital"></i> Sistema Hospitalario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/citas"><i class="bi bi-calendar-check"></i> Directorio de Citas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/pacientes/nuevo"><i class="bi bi-person-plus"></i> Apertura de Paciente</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3" th:text="${#authentication.name != null ? #authentication.name : 'Usuario'}"><i class="bi bi-person-badge"></i> Usuario</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-calendar-plus text-success fs-3"></i>
                        <div>
                            <h3 class="h5 text-dark fw-bold mb-0">Programar Nueva Cita Médica</h3>
                            <p class="text-muted small mb-0">Asigne un paciente a una agenda médica disponible.</p>
                        </div>
                    </div>
                </div>
                <div class="card-body p-4">
                    
                    <form th:action="@{/citas/guardar}" method="post">
                        
                        <div class="bg-light rounded p-3 mb-4 border">
                            <label class="form-label fw-bold text-primary small"><i class="bi bi-search me-1"></i> Búsqueda Rápida de Paciente</label>
                            <div class="input-group mb-2">
                                <input type="text" id="dniSearch" class="form-control" placeholder="Ingrese el DNI a buscar" maxlength="8">
                                <button class="btn btn-primary" type="button" id="btnSearchDni">Buscar y Seleccionar</button>
                            </div>
                            <div id="searchResultMsg" class="small"></div>
                        </div>

                        <div class="mb-4">
                            <label for="idPaciente" class="form-label fw-medium text-dark small">Paciente Seleccionado (*)</label>
                            <select class="form-select bg-light border-secondary" id="idPaciente" name="idPaciente" required>
                                <option value="" disabled selected>-- Busque o seleccione manualmente un paciente --</option>
                                <option th:each="p : ${pacientes}" 
                                        th:value="${p.idPaciente}" 
                                        th:data-dni="${p.dniPaciente}"
                                        th:text="${p.nombreCompleto + ' (DNI: ' + p.dniPaciente + ')'}">
                                    Paciente
                                </option>
                            </select>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="idEspecialidad" class="form-label fw-medium text-dark small">Especialidad (*)</label>
                                <select class="form-select bg-light" id="idEspecialidad" name="idEspecialidad" required>
                                    <option value="" disabled selected>-- Seleccione especialidad --</option>
                                    <option th:each="e : ${especialidades}" th:value="${e.idEspecialidad}" th:text="${e.nombreEspecialidad}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="idMedico" class="form-label fw-medium text-dark small">Médico Especialista (*)</label>
                                <select class="form-select bg-light" id="idMedico" name="idMedico" required disabled>
                                    <option value="" disabled selected>-- Seleccione primera especialidad --</option>
                                    <option th:each="m : ${medicos}" th:value="${m.idMedico}" th:data-especialidad="${m.especialidad != null ? m.especialidad.idEspecialidad : 'N'}" th:text="${'Dr. ' + m.nombreCompleto}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="idAgenda" class="form-label fw-medium text-dark small">Horario de Agenda Disponible (*)</label>
                            <select class="form-select bg-light" id="idAgenda" name="idAgenda" required disabled>
                                <option value="" disabled selected>-- Seleccione primero un médico --</option>
                                <option th:each="a : ${agendasDisponibles}" th:value="${a.idAgenda}" th:data-medico="${a.medico != null ? a.medico.idMedico : 'N'}" th:text="${'Fecha: ' + (a.fechaAgenda != null ? #temporals.format(a.fechaAgenda, 'dd/MM/yyyy') : '--') + ' | Inicio: ' + a.horaInicio + ' - Fin: ' + a.horaFin}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="motivoConsulta" class="form-label fw-medium text-dark small">Motivo de la Consulta</label>
                            <textarea class="form-control bg-light" id="motivoConsulta" name="motivoConsulta" rows="3"></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="/citas" class="btn btn-light border px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4 shadow-sm">
                                <i class="bi bi-calendar-check me-1"></i> Confirmar y Registrar
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Lógica para filtrar Médico y Agenda (Mantengo la misma de la versión anterior)
    const especialidadSelect = document.getElementById("idEspecialidad");
    const medicoSelect = document.getElementById("idMedico");
    const agendaSelect = document.getElementById("idAgenda");
    
    const medicosOptions = Array.from(medicoSelect.options).filter(opt => opt.value !== "");
    const agendasOptions = Array.from(agendaSelect.options).filter(opt => opt.value !== "");

    especialidadSelect.addEventListener("change", function() {
        const selectedEsp = this.value;
        medicoSelect.innerHTML = '<option value="" disabled selected>-- Seleccione médico --</option>';
        agendaSelect.innerHTML = '<option value="" disabled selected>-- Seleccione primero un médico --</option>';
        medicoSelect.disabled = false;
        agendaSelect.disabled = true;

        medicosOptions.forEach(opt => {
            if (opt.getAttribute("data-especialidad") === selectedEsp) medicoSelect.appendChild(opt.cloneNode(true));
        });
    });

    medicoSelect.addEventListener("change", function() {
        const selectedMedico = this.value;
        agendaSelect.innerHTML = '<option value="" disabled selected>-- Seleccione un horario disponible --</option>';
        agendaSelect.disabled = false;

        let found = false;
        agendasOptions.forEach(opt => {
            if (opt.getAttribute("data-medico") === selectedMedico) {
                agendaSelect.appendChild(opt.cloneNode(true));
                found = true;
            }
        });
        if(!found) agendaSelect.innerHTML = '<option value="" disabled selected>-- No hay horarios --</option>';
    });

    // NUEVA LÓGICA: Búsqueda de DNI en Select
    const btnSearchDni = document.getElementById('btnSearchDni');
    const dniSearch = document.getElementById('dniSearch');
    const pacienteSelect = document.getElementById('idPaciente');
    const searchResultMsg = document.getElementById('searchResultMsg');

    btnSearchDni.addEventListener('click', function() {
        const searchValue = dniSearch.value.trim();
        if(searchValue === '') return;
        
        let found = false;
        const options = pacienteSelect.options;
        
        for(let i=0; i < options.length; i++) {
            if(options[i].getAttribute('data-dni') === searchValue) {
                pacienteSelect.selectedIndex = i;
                found = true;
                
                // Efecto visual de encontrado
                pacienteSelect.classList.add('is-valid');
                setTimeout(() => pacienteSelect.classList.remove('is-valid'), 2000);
                
                searchResultMsg.innerHTML = '<span class="text-success fw-medium"><i class="bi bi-check-circle me-1"></i> Paciente encontrado y autoseleccionado.</span>';
                break;
            }
        }
        
        if(!found) {
            pacienteSelect.selectedIndex = 0; // Resetear
            searchResultMsg.innerHTML = '<div class="alert alert-warning mt-2 mb-0 py-2"><i class="bi bi-exclamation-triangle me-1"></i> El paciente no existe. <a href="/pacientes/nuevo" class="fw-bold alert-link text-decoration-underline">Haga clic aquí para registrarlo</a>.</div>';
        }
    });

    // Buscar con la tecla ENTER
    dniSearch.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Evitar submit del form
            btnSearchDni.click();
        }
    });
});
</script>
</body>
</html>
