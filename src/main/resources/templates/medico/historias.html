<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias Clínicas | Área Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/medico/dashboard">
            <i class="bi bi-hospital"></i> Área Médica
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/medico/dashboard"><i class="bi bi-speedometer2"></i> Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/medico/historias"><i class="bi bi-journal-medical"></i> Historias Clínicas</a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm text-white border-white" type="submit">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
        <h3 class="fw-bold text-dark">
            <i class="bi bi-journal-medical text-primary me-2"></i> Directorio de Historias Clínicas
        </h3>
        <a href="/medico/dashboard" class="btn btn-outline-secondary shadow-sm">Volver al Panel</a>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="@{/medico/historias}" method="get" class="mb-4">
        <div class="input-group shadow-sm">
            <input type="text" name="dni" class="form-control" placeholder="Buscar historia por DNI del paciente..." th:value="${dniBuscado}">
            <button class="btn btn-primary px-4" type="submit"><i class="bi bi-search me-1"></i> Buscar</button>
        </div>
    </form>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="px-4">N° Historia</th>
                        <th>Paciente</th>
                        <th>DNI</th>
                        <th>Fecha de Apertura</th>
                        <th class="text-end px-4">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="historia : ${historias}">
                        <td class="px-4 fw-bold text-primary" th:text="${'HC-' + historia.idHistoriaClinica}">HC-001</td>
                        <td class="fw-semibold" th:text="${historia.paciente != null ? historia.paciente.nombreCompleto : 'N/A'}">Nombre Paciente</td>
                        <td th:text="${historia.paciente != null ? historia.paciente.dniPaciente : 'N/A'}">12345678</td>
                        <td th:text="${#temporals.format(historia.fechaApertura, 'dd/MM/yyyy')}">Fecha</td>
                        <td class="text-end px-4">
                            <a th:href="@{/medico/historias/{id}(id=${historia.idHistoriaClinica})}" class="btn btn-sm btn-primary shadow-sm text-white">
                                <i class="bi bi-folder2-open me-1"></i> Consultar / Actualizar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${historias.empty}">
                        <td colspan="5" class="text-center text-muted py-4">No se encontraron historias clínicas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
