<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Atención Médica | Sistema Hospitalario</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Médico</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/medico/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/medico/historias}">Historias clínicas</a>
                <a class="nav-link" th:href="@{/medico/atencion}">Atención médica</a>
                <a class="nav-link" th:href="@{/medico/receta}">Receta médica</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Atención Médica</h1>
                    <p class="text-muted">
                        Actualización de historia clínica durante la atención del paciente.
                    </p>
                </div>

                <a th:href="@{/medico/historias}" class="btn btn-outline-secondary">
                    Volver a historias clínicas
                </a>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos del paciente</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Paciente</label>
                            <input type="text" class="form-control" value="Juan Pérez Ramos" readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">DNI</label>
                            <input type="text" class="form-control" value="76543210" readonly>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">Edad</label>
                            <input type="text" class="form-control" value="35" readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Historia clínica</label>
                            <input type="text" class="form-control" value="HC-0001" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos de triaje</h5>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Peso</label>
                            <input type="text" class="form-control" value="70 kg" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Talla</label>
                            <input type="text" class="form-control" value="170 cm" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Temperatura</label>
                            <input type="text" class="form-control" value="36.8 °C" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Presión arterial</label>
                            <input type="text" class="form-control" value="120/80" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Frecuencia cardíaca</label>
                            <input type="text" class="form-control" value="75 lpm" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Frecuencia respiratoria</label>
                            <input type="text" class="form-control" value="18 rpm" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Saturación O₂</label>
                            <input type="text" class="form-control" value="98%" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Dolor</label>
                            <input type="text" class="form-control" value="Leve" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <form action="#" method="post">

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Evaluación médica</h5>

                        <div class="row g-3">

                            <div class="col-md-12">
                                <label class="form-label">Motivo de consulta</label>
                                <textarea class="form-control"
                                          rows="3"
                                          placeholder="Ingrese el motivo de consulta">Dolor de cabeza y malestar general.</textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Exámenes realizados</label>
                                <textarea class="form-control"
                                          rows="3"
                                          placeholder="Ingrese los exámenes realizados durante la atención"></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Diagnóstico</label>
                                <textarea class="form-control"
                                          rows="3"
                                          placeholder="Ingrese el diagnóstico médico"></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Tratamiento</label>
                                <textarea class="form-control"
                                          rows="3"
                                          placeholder="Ingrese el tratamiento indicado"></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Recomendaciones</label>
                                <textarea class="form-control"
                                          rows="3"
                                          placeholder="Ingrese recomendaciones para el paciente"></textarea>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">¿Requiere medicación?</label>
                                <select class="form-select">
                                    <option selected>Seleccione</option>
                                    <option>Sí</option>
                                    <option>No</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Estado de atención</label>
                                <input type="text" class="form-control" value="EN ATENCIÓN" readonly>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Médico responsable</label>
                                <input type="text" class="form-control" value="Dr. Carlos Mendoza" readonly>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="card card-stat">
                    <div class="card-body d-flex justify-content-end gap-2">
                        <a th:href="@{/medico/historias}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <a th:href="@{/medico/receta}" class="btn btn-outline-success">
                            Generar receta médica
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Guardar atención médica
                        </button>
                    </div>
                </div>

            </form>

        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

</body>
</html>
