<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Atención | Área Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/medico/dashboard"><i class="bi bi-hospital"></i> Área Médica</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/medico/dashboard"><i class="bi bi-speedometer2"></i> Panel</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medico/historias"><i class="bi bi-journal-medical"></i> Historias Clínicas</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3"><i class="bi bi-person-badge"></i> Dr(a). <span th:text="${#authentication.name}">Usuario</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm text-white border-white" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                <h4 class="fw-bold text-dark mb-0"><i class="bi bi-clipboard2-pulse text-primary me-2"></i>Registrar Nueva Atención</h4>
                <a th:href="@{/medico/historias/{id}(id=${historia.idHistoriaClinica})}" class="btn btn-outline-secondary shadow-sm"><i class="bi bi-arrow-left me-1"></i> Volver a la Historia</a>
            </div>

            <div th:if="${error}" class="alert alert-danger shadow-sm"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span></div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h6 class="fw-bold text-muted text-uppercase">Paciente: <span class="text-primary" th:text="${historia.paciente.nombreCompleto}"></span></h6>
                </div>
                <div class="card-body p-4">
                    
                    <form th:action="@{/medico/atencion/guardar}" method="post">
                        <input type="hidden" name="idHistoriaClinica" th:value="${historia.idHistoriaClinica}" />
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Médico Tratante <span class="text-danger">*</span></label>
                            <select name="idMedico" class="form-select bg-light" required>
                                <option value="" disabled selected>Seleccione el médico a cargo...</option>
                                <option th:each="medico : ${medicos}" th:value="${medico.idMedico}" th:text="${medico.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Diagnóstico Clínico <span class="text-danger">*</span></label>
                            <textarea name="diagnostico" class="form-control bg-light" rows="3" placeholder="Detalle el diagnóstico del paciente..." required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Tratamiento Indicado <span class="text-danger">*</span></label>
                            <textarea name="tratamiento" class="form-control bg-light" rows="3" placeholder="Especifique el tratamiento a seguir..." required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Recomendaciones Adicionales</label>
                            <textarea name="recomendaciones" class="form-control bg-light" rows="2" placeholder="Reposo, dieta, cuidados..."></textarea>
                        </div>
                        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                            <a th:href="@{/medico/historias/{id}(id=${historia.idHistoriaClinica})}" class="btn btn-light me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary shadow-sm text-white px-4"><i class="bi bi-save me-1"></i> Guardar Atención</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
