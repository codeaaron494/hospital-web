<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Historia Clínica | Sistema Hospitalario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Médico</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/medico/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/medico/historias}">Consultar historia clínica</a>
                <a class="nav-link" th:href="@{/medico/historias}">Actualizar historia clínica</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Actualizar Historia Clínica</h1>
                    <p class="text-muted">
                        Registro de atención médica, diagnóstico, tratamiento y recomendaciones.
                    </p>
                </div>

                <a th:href="@{/medico/historias/{id}(id=${historia.idHistoriaClinica})}" class="btn btn-outline-secondary">
                    Volver a historia
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/medico/atencion/guardar}" method="post">

                <input type="hidden" name="idHistoriaClinica" th:value="${historia.idHistoriaClinica}">

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Datos de historia clínica</h5>

                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Código HC</label>
                                <input class="form-control" th:value="${'HC-' + historia.idHistoriaClinica}" readonly>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">DNI</label>
                                <input class="form-control" th:value="${historia.paciente.dniPaciente}" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Paciente</label>
                                <input class="form-control" th:value="${historia.paciente.nombreCompleto}" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Datos de atención médica</h5>

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Médico responsable</label>
                                <select name="idMedico" class="form-select" required>
                                    <option value="">Seleccione médico</option>
                                    <option th:each="medico : ${medicos}"
                                            th:value="${medico.idMedico}"
                                            th:text="${medico.nombreCompleto + ' - ' + medico.especialidad.nombreEspecialidad}">
                                        Médico
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Diagnóstico</label>
                                <textarea name="diagnostico" class="form-control" rows="3" required></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Tratamiento</label>
                                <textarea name="tratamiento" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Recomendaciones</label>
                                <textarea name="recomendaciones" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card card-stat">
                    <div class="card-body d-flex justify-content-end gap-2">
                        <a th:href="@{/medico/historias/{id}(id=${historia.idHistoriaClinica})}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Guardar atención médica
                        </button>
                    </div>
                </div>

            </form>

        </main>

    </div>
</div>

</body>
</html>
