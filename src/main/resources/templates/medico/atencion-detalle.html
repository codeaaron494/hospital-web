<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Atención | Área Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/medico/dashboard"><i class="bi bi-hospital"></i> Área Médica</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/medico/dashboard">Panel</a></li>
                <li class="nav-item"><a class="nav-link active" href="/medico/historias">Historias Clínicas</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3"><i class="bi bi-person-badge"></i> Dr(a). <span th:text="${#authentication.name}">Usuario</span></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm text-white border-white" type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                <h4 class="fw-bold text-dark mb-0"><i class="bi bi-file-earmark-medical text-primary me-2"></i>Atención: <span th:text="${'ATE-' + atencion.idAtencion}">ATE-001</span></h4>
                <a th:href="@{/medico/historias/{id}(id=${atencion.historiaClinica.idHistoriaClinica})}" class="btn btn-outline-secondary shadow-sm"><i class="bi bi-arrow-left me-1"></i> Volver a la Historia</a>
            </div>

            <div th:if="${success}" class="alert alert-success shadow-sm"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-danger shadow-sm"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span></div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted small fw-bold">Fecha de Atención</p>
                            <p class="fw-semibold" th:text="${#temporals.format(atencion.fechaAtencion, 'dd/MM/yyyy HH:mm')}">Fecha</p>
                        </div>
                        <div class="col-md-6 text-end">
                            
                            <a th:if="${receta != null}" th:href="@{/medico/receta/{idReceta}(idReceta=${receta.idReceta})}" class="btn btn-success shadow-sm text-white">
                                <i class="bi bi-capsule me-2"></i> Ver Receta Médica
                            </a>
                            
                            <form th:if="${receta == null}" th:action="@{/medico/receta/generar}" method="post" class="d-inline m-0">
                                <input type="hidden" name="idAtencion" th:value="${atencion.idAtencion}" />
                                <button type="submit" class="btn btn-success shadow-sm text-white">
                                    <i class="bi bi-capsule me-2"></i> Generar Receta
                                </button>
                            </form>

                        </div>
                    </div>

                    <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">Diagnóstico Clínico</h6>
                    <p class="bg-light p-3 rounded-3" th:text="${atencion.diagnostico}"></p>

                    <h6 class="fw-bold text-primary border-bottom pb-2 mb-3 mt-4">Tratamiento</h6>
                    <p class="bg-light p-3 rounded-3" th:text="${atencion.tratamiento}"></p>

                    <h6 class="fw-bold text-primary border-bottom pb-2 mb-3 mt-4">Recomendaciones</h6>
                    <p class="bg-light p-3 rounded-3" th:text="${#strings.isEmpty(atencion.recomendaciones) ? 'Ninguna indicación adicional.' : atencion.recomendaciones}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
