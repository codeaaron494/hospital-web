<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Atención Médica | Sistema Hospitalario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Médico</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/medico/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/medico/historias}">Consultar historia clínica</a>
                <a class="nav-link" th:href="@{/medico/historias}">Actualizar historia clínica</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Detalle de Atención Médica</h1>
                    <p class="text-muted">
                        Registro clínico agregado a la historia del paciente.
                    </p>
                </div>

                <a th:href="@{/medico/historias/{id}(id=${atencion.historiaClinica.idHistoriaClinica})}" class="btn btn-outline-secondary">
                    Volver a historia
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Datos generales</h5>

                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Código atención</label>
                            <input class="form-control" th:value="${'ATE-' + atencion.idAtencion}" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Fecha atención</label>
                            <input class="form-control" th:value="${#temporals.format(atencion.fechaAtencion, 'dd/MM/yyyy HH:mm')}" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Historia clínica</label>
                            <input class="form-control" th:value="${'HC-' + atencion.historiaClinica.idHistoriaClinica}" readonly>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Médico</label>
                            <input class="form-control" th:value="${atencion.medico.nombreCompleto}" readonly>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">DNI paciente</label>
                            <input class="form-control" th:value="${atencion.historiaClinica.paciente.dniPaciente}" readonly>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">Paciente</label>
                            <input class="form-control" th:value="${atencion.historiaClinica.paciente.nombreCompleto}" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-stat mb-4">
                <div class="card-body">
                    <h5 class="mb-3">Evaluación médica</h5>

                    <div class="mb-3">
                        <label class="form-label">Diagnóstico</label>
                        <textarea class="form-control" rows="3" readonly th:text="${atencion.diagnostico}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tratamiento</label>
                        <textarea class="form-control" rows="3" readonly th:text="${atencion.tratamiento}"></textarea>
                    </div>

                    <div>
                        <label class="form-label">Recomendaciones</label>
                        <textarea class="form-control" rows="3" readonly th:text="${atencion.recomendaciones}"></textarea>
                    </div>
                </div>
            </div>

            <div class="card card-stat">
                <div class="card-body d-flex justify-content-end gap-2">
                    <a th:href="@{/medico/historias/{id}(id=${atencion.historiaClinica.idHistoriaClinica})}"
                       class="btn btn-outline-secondary">
                        Volver a historia
                    </a>

                    <form th:if="${receta == null}" th:action="@{/medico/receta/generar}" method="post">
                        <input type="hidden" name="idAtencion" th:value="${atencion.idAtencion}">
                        <button type="submit" class="btn btn-primary">
                            Generar receta médica
                        </button>
                    </form>

                    <a th:if="${receta != null}"
                       th:href="@{/medico/receta/{id}(id=${receta.idReceta})}"
                       class="btn btn-success">
                        Ver receta médica
                    </a>
                </div>
            </div>

        </main>

    </div>
</div>

</body>
</html>
