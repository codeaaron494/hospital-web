<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Balance Mensual | Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/farmacia/almacen/dashboard">
                <i class="bi bi-box-seam me-1"></i> Área de Almacén
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/farmacia/almacen/dashboard"><i class="bi bi-speedometer2"></i> Panel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/compras/ordenes"><i class="bi bi-file-earmark-text"></i> Órdenes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/compras/guias"><i class="bi bi-truck"></i> Guías</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/farmacia/inventario/medicamentos"><i class="bi bi-capsule"></i> Inventario</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text text-white me-3"><i class="bi bi-person-badge"></i> Almacenero: <span th:text="${#authentication.name}">Usuario</span></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm border-white" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <h1 class="h3 mb-0 text-success fw-bold">
                            <i class="bi bi-file-earmark-plus me-2"></i>Generar Balance Mensual
                        </h1>
                        <p class="text-muted mb-0 mt-1">Consolide de forma automatizada los movimientos del Kardex de un periodo.</p>
                    </div>
                    <a th:href="@{/farmacia/inventario/balances}" class="btn btn-outline-secondary shadow-sm">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5 border-top border-success border-4">
                    <div class="card-body p-5">
                        <form th:action="@{/farmacia/inventario/balances/guardar}" method="post">
                            
                            <div class="row g-4 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Periodo <span class="text-danger">*</span></label>
                                    <input type="month" name="periodo" class="form-control bg-light" required>
                                    <div class="form-text"><i class="bi bi-info-circle me-1"></i>Mes a consolidar.</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Estado Inicial</label>
                                    <input type="text" value="GENERADO" class="form-control bg-light text-muted" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-dark">Destino</label>
                                    <input type="text" value="Químico Farmacéutico" class="form-control bg-light text-muted" readonly>
                                </div>
                            </div>

                            <div class="mb-5">
                                <label class="form-label fw-bold text-dark"><i class="bi bi-chat-text text-secondary me-1"></i> Observaciones del Periodo</label>
                                <textarea name="observacion" class="form-control bg-light" rows="3" placeholder="Ej. Balance mensual generado para revisión. Incluye ajustes por mermas..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end pt-3 border-top">
                                <button type="submit" class="btn btn-success text-white px-5 shadow-sm fw-bold">
                                    <i class="bi bi-lightning-charge me-2"></i> Generar Balance Automático
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
