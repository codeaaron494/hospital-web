<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Medicamento | Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/farmacia/almacen/dashboard">
                <i class="bi bi-box-seam me-1"></i> Área de Almacén
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/farmacia/almacen/dashboard"><i class="bi bi-speedometer2"></i> Panel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/compras/ordenes"><i class="bi bi-file-earmark-text"></i> Órdenes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/compras/guias"><i class="bi bi-truck"></i> Guías</a></li>
                    <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span class="navbar-text text-white me-3"><i class="bi bi-person-badge"></i> Almacenero: <span th:text="${#authentication.name}">Usuario</span></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm border-white" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <h1 class="h3 mb-0 text-success fw-bold">
                            <i class="bi bi-capsule me-2"></i>Nuevo Medicamento
                        </h1>
                        <p class="text-muted mb-0 mt-1">
                            Incorpore un nuevo producto al catálogo. Su Kardex se creará automáticamente.
                        </p>
                    </div>
                    <a th:href="@{/farmacia/inventario/medicamentos}" class="btn btn-outline-secondary shadow-sm">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5 border-top border-success border-4">
                    <div class="card-body p-5">
                        <form th:action="@{/farmacia/inventario/medicamentos/guardar}" method="post">
                            <div class="row g-4 mb-4">

                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">
                                        Nombre del Medicamento <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" name="nombreMedicamento" class="form-control bg-light" placeholder="Ej. Amoxicilina, Paracetamol..." required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">
                                        Concentración <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" name="concentracion" class="form-control bg-light" placeholder="Ej. 500 mg, 1g, 5ml..." required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">
                                        Presentación Física <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" name="presentacion" class="form-control bg-light" placeholder="Ej. Tableta, Jarabe, Ampolla..." required>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-dark">
                                        Categoría Terapéutica <span class="text-danger">*</span>
                                    </label>
                                    <select name="idCategoria" class="form-select bg-light" required>
                                        <option value="" disabled selected>Seleccione la categoría...</option>
                                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombreCategoria}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">
                                        Límite de Stock Mínimo <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" name="stockMinimo" class="form-control bg-light" min="1" placeholder="Ej. 20" required>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle"></i> Disparará alertas de reposición al llegar a este nivel.
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-dark">
                                        Stock Inicial <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" name="stockActual" class="form-control bg-light" min="0" placeholder="Ej. 100" required>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle"></i> Cantidad inicial disponible en almacén.
                                    </div>
                                </div>

                            </div>

                            <div class="d-flex justify-content-end pt-3 border-top">
                                <button type="submit" class="btn btn-success text-white px-5 shadow-sm fw-bold">
                                    <i class="bi bi-save me-2"></i> Guardar Medicamento
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
