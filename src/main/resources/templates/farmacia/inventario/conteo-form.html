<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Conteo Físico | Área de Almacén</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/farmacia/inventario/dashboard"><i class="bi bi-boxes me-1"></i> Control de Inventario</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/dashboard">Panel</a></li>
                <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/medicamentos">Medicamentos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/farmacia/inventario/conteos">Conteos Físicos</a></li>
                <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/kardex">Kardex</a></li>
                <li class="nav-item"><a class="nav-link" href="/farmacia/inventario/balances">Balances</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm border-white" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold text-dark mb-0">
                        <i class="bi bi-list-check text-primary me-2"></i>Registrar Conteo Físico
                    </h4>
                    <p class="text-muted mb-0 mt-1">Ingrese la cantidad real hallada en los estantes.</p>
                </div>
                <a th:href="@{/farmacia/inventario/dashboard}" class="btn btn-outline-secondary shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Cancelar
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger shadow-sm"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span></div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5 border-top border-primary border-4">
                <div class="card-body p-5">
                    <form th:action="@{/farmacia/inventario/conteos/guardar}" method="post">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Medicamento del Catálogo <span class="text-danger">*</span></label>
                            <select name="idMedicamento" class="form-select form-select-lg bg-light" required>
                                <option value="" disabled selected>-- Seleccione el medicamento auditado --</option>
                                <option th:each="med : ${medicamentos}"
                                        th:value="${med.idMedicamento}"
                                        th:text="${med.nombreCompleto + ' (Stock Teórico: ' + med.stockActual + ')'}">
                                </option>
                            </select>
                            <div class="form-text mt-2"><i class="bi bi-info-circle"></i> Compare el stock teórico contra su hallazgo físico.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark">Stock Físico (Conteo Real) <span class="text-danger">*</span></label>
                            <input type="number" name="stockFisico" class="form-control form-control-lg bg-light" min="0" placeholder="0" required>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold text-dark">Observaciones / Justificación</label>
                            <textarea name="observaciones" class="form-control bg-light" rows="3" placeholder="Si hay diferencias, explique por qué (ej. cajas rotas, mermas, vencimientos)..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end pt-3 border-top">
                            <button type="submit" class="btn btn-primary text-white px-5 shadow-sm fw-bold btn-lg">
                                <i class="bi bi-check2-square me-2"></i> Guardar Conteo
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
