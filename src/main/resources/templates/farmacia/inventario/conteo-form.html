<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Conteo Físico | Inventario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Inventario</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/farmacia/inventario/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/medicamentos}">Medicamentos</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/kardex}">Consultar Kardex</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/conteos}">Conteos físicos</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/conteos/nuevo}">Registrar conteo físico</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/balances}">Balances mensuales</a>
                <a class="nav-link" th:href="@{/farmacia/inventario/balances/nuevo}">Generar balance mensual</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Registrar Conteo Físico</h1>
                    <p class="text-muted">
                        Creación de un conteo físico para validar el stock real de medicamentos.
                    </p>
                </div>

                <a th:href="@{/farmacia/inventario/conteos}" class="btn btn-outline-secondary">
                    Volver a conteos
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/farmacia/inventario/conteos/guardar}" method="post">

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Datos del conteo</h5>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Estado inicial</label>
                                <input type="text" class="form-control" value="REGISTRADO" readonly>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label">Observación</label>
                                <input type="text"
                                       name="observacion"
                                       class="form-control"
                                       placeholder="Ej. Conteo físico mensual de farmacia">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card card-stat">
                    <div class="card-body d-flex justify-content-end gap-2">
                        <a th:href="@{/farmacia/inventario/conteos}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Registrar conteo
                        </button>
                    </div>
                </div>

            </form>

        </main>

    </div>
</div>

</body>
</html>
