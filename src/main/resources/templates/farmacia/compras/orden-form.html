<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generar Orden de Compra | Compras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <h4 class="text-white mb-4">Compras</h4>

            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/farmacia/compras/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/farmacia/compras/kardex}">Consultar Kardex</a>
                <a class="nav-link" th:href="@{/farmacia/compras/ordenes}">Órdenes de compra</a>
                <a class="nav-link" th:href="@{/farmacia/compras/ordenes/nueva}">Generar orden de compra</a>
                <a class="nav-link" th:href="@{/farmacia/compras/guias}">Guías de remisión</a>
                <a class="nav-link" th:href="@{/farmacia/compras/guias/nueva}">Registrar guía de remisión</a>

                <hr class="text-white">

                <a class="nav-link" th:href="@{/logout}">Cerrar sesión</a>
            </nav>
        </aside>

        <main class="col-md-9 col-lg-10 content-wrapper">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title">Generar Orden de Compra</h1>
                    <p class="text-muted">
                        Registro inicial de una orden de compra para proveedor farmacéutico.
                    </p>
                </div>

                <a th:href="@{/farmacia/compras/ordenes}" class="btn btn-outline-secondary">
                    Volver a órdenes
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/farmacia/compras/ordenes/guardar}" method="post">

                <div class="card card-stat mb-4">
                    <div class="card-body">
                        <h5 class="mb-3">Datos de orden</h5>

                        <div class="row g-3">

                            <div class="col-md-12">
                                <label class="form-label">Proveedor</label>
                                <select name="idProveedor" class="form-select" required>
                                    <option value="">Seleccione proveedor</option>
                                    <option th:each="proveedor : ${proveedores}"
                                            th:value="${proveedor.idProveedor}"
                                            th:text="${proveedor.rucProveedor + ' - ' + proveedor.razonSocial}">
                                        Proveedor
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label">Observación</label>
                                <textarea name="observacion"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Ej. Orden generada por necesidad de reposición"></textarea>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="card card-stat">
                    <div class="card-body d-flex justify-content-end gap-2">
                        <a th:href="@{/farmacia/compras/ordenes}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            Generar orden
                        </button>
                    </div>
                </div>

            </form>

        </main>
    </div>
</div>

</body>
</html>
