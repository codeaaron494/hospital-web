<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head">
    <meta charset="UTF-8">
    <title>Generar Orden de Compra | Almacén</title>
</head>
<body>
    <header th:replace="layout/layout :: header"></header>

    <div class="container-fluid mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <h1 class="h3 mb-0 text-primary">
                            <i class="fas fa-file-invoice text-success me-2"></i>Nueva Orden de Compra
                        </h1>
                        <p class="text-muted mb-0 mt-1">
                            Paso 1: Registre los datos generales y seleccione el proveedor.
                        </p>
                    </div>
                    <a th:href="@{/farmacia/compras/kardex}" class="btn btn-outline-secondary shadow-sm">
                        <i class="fas fa-arrow-left me-1"></i> Volver al Kardex
                    </a>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5 border-top border-success border-4">
                    <div class="card-body p-5">
                        <form th:action="@{/farmacia/compras/ordenes/guardar}" method="post">
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-building text-secondary me-1"></i> Proveedor Farmacéutico <span class="text-danger">*</span>
                                </label>
                                <select name="idProveedor" class="form-select form-select-lg bg-light" required>
                                    <option value="" disabled selected>-- Seleccione el proveedor del catálogo --</option>
                                    <option th:each="proveedor : ${proveedores}"
                                            th:value="${proveedor.idProveedor}"
                                            th:text="${proveedor.rucProveedor + ' - ' + proveedor.razonSocial}">
                                    </option>
                                </select>
                                <div class="form-text mt-2">
                                    <i class="fas fa-info-circle"></i> Solo se muestran los proveedores activos en el sistema.
                                </div>
                            </div>

                            <div class="mb-5">
                                <label class="form-label fw-bold text-dark">
                                    <i class="fas fa-pencil-alt text-secondary me-1"></i> Observación / Justificación
                                </label>
                                <textarea name="observacion"
                                          class="form-control bg-light"
                                          rows="4"
                                          placeholder="Ej. Orden generada por necesidad de reposición de inventario tras revisión del Kardex..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end pt-3 border-top">
                                <a th:href="@{/farmacia/almacen/dashboard}" class="btn btn-light me-3 px-4 shadow-sm border">Cancelar</a>
                                <button type="submit" class="btn btn-success text-white px-5 shadow-sm fw-bold">
                                    <i class="fas fa-arrow-right me-2"></i> Siguiente: Agregar Medicamentos
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
