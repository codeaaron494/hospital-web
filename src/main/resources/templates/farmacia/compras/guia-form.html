<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Guía de Remisión | Área de Almacén</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/farmacia/compras/dashboard">
            <i class="bi bi-box-seam me-1"></i> Área de Almacén
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/farmacia/compras/dashboard">Panel</a></li>
                <li class="nav-item"><a class="nav-link" href="/farmacia/compras/ordenes">Historial de Órdenes</a></li>
                <li class="nav-item"><a class="nav-link active" href="/farmacia/compras/guias">Historial de Guías</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-outline-light btn-sm border-white" type="submit">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold text-dark mb-0">
                        <i class="bi bi-clipboard-plus text-info me-2"></i>Registrar Nueva Guía
                    </h4>
                    <p class="text-muted mb-0 mt-1">Paso 1: Vincule la guía con una orden previamente autorizada.</p>
                </div>
                <a th:href="@{/farmacia/compras/guias}" class="btn btn-outline-secondary shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Cancelar
                </a>
            </div>

            <div th:if="${error}" class="alert alert-danger shadow-sm"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span></div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5 border-top border-info border-4">
                <div class="card-body p-5">
                    <form th:action="@{/farmacia/compras/guias/guardar}" method="post">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark"><i class="bi bi-file-earmark-check me-1"></i> Orden de Compra Autorizada <span class="text-danger">*</span></label>
                            <select name="idOrdenCompra" class="form-select form-select-lg bg-light border-info" required>
                                <option value="" disabled selected>-- Seleccione una orden pendiente de ingreso --</option>
                                <option th:each="orden : ${ordenes}"
                                        th:value="${orden.idOrdenCompra}"
                                        th:text="${'OC-' + orden.idOrdenCompra + ' | ' + orden.proveedor.razonSocial + ' | ' + #temporals.format(orden.fechaEmision, 'dd/MM/yyyy HH:mm')}">
                                </option>
                            </select>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">N° Guía Física del Proveedor <span class="text-danger">*</span></label>
                                <input type="text" name="numeroGuia" class="form-control bg-light" placeholder="Ej. GR-001-4589" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-dark">Fecha de Emisión de la Guía <span class="text-danger">*</span></label>
                                <input type="date" name="fechaEmision" class="form-control bg-light" required>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label fw-bold text-dark">Observaciones de Recepción</label>
                            <textarea name="observacion" class="form-control bg-light" rows="3" placeholder="Indique si hay cajas dañadas, diferencias de clima, etc..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end pt-3 border-top">
                            <button type="submit" class="btn btn-info text-white px-5 shadow-sm fw-bold">
                                <i class="bi bi-arrow-right-circle me-2"></i> Crear Guía y Añadir Detalles
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
